# Fork-only test build of Sync View (and the linked reference/drawing navigation under it).
# Windows only: format, clippy and tests of the touched crate, then builds an UNSIGNED Windows x64
# MSI installer with packaging/windows/package.ps1 (static CRT, --features heif). Nothing is
# published: the MSI is a downloadable artifact of the run. The official signed release stays in release.yml.
name: Linked navigation (Windows x64 installer)

# Manual only (Actions › Run workflow): pushes build the quicker Fast Preview instead
# (fast-preview-windows.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linked-navigation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows only (the artist's platform). Format and clippy first: they fail in minutes.
  checks:
    name: checks (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      # Each check runs even if an earlier one failed, so one run reports every problem; the job
      # still fails (and the zip is not built) if any of them does.
      - name: Clippy photocraft-ui-egui
        if: ${{ !cancelled() }}
        run: cargo clippy -p photocraft-ui-egui --all-targets --locked -- -D warnings

      - name: Test photocraft-ui-egui (lib + integration tests)
        if: ${{ !cancelled() }}
        run: cargo test -p photocraft-ui-egui --lib --tests --locked

  # Offscreen screenshots of the real UI (the project's snapshot example) to check where the Sync
  # View button sits in the options bar. Runs beside the checks; never blocks the zip.
  toolbar-snapshot:
    name: toolbar snapshot (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: snapshot

      - name: Render the options bar
        shell: pwsh
        run: |
          cargo build --release --locked -p photocraft-ui-egui --example snapshot
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $exe = 'target\release\examples\snapshot.exe'
          New-Item -ItemType Directory -Force shots | Out-Null
          $doc = '["engine.execute", {"command": "file.new", "params": {"width": 1920, "height": 1080, "name": "sync-test"}}]'
          $brush = '["ui.set", {"tool": "brush"}]'
          $sync = '["ui.menu.invoke", {"command": "window.arrange.syncView"}]'
          & $exe --out shots/1-no-document.png --size 1600x900 --scale 1 --script "[$brush]"
          & $exe --out shots/2-sync-off.png --size 1600x900 --scale 1 --script "[$doc, $brush]"
          & $exe --out shots/3-sync-on.png --size 1600x900 --scale 1 --script "[$doc, $brush, $sync]"
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        with:
          name: toolbar-snapshots
          path: shots
          retention-days: 14

  portable:
    name: MSI installer (windows x64, unsigned)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: msi-x64

      - name: Install WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      # package.ps1 builds the exes (static CRT, --features heif), checks their PE headers, builds and
      # validates the MSI, and skips signing when no signing secrets are set.
      - name: Build the MSI installer
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Checksum
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/release -Filter *.msi
          if ($msi.Count -ne 1) { throw "expected one MSI, found $($msi.Count)" }
          "$((Get-FileHash $msi[0].FullName -Algorithm SHA256).Hash)  $($msi[0].Name)" | Set-Content -Encoding ascii "$($msi[0].FullName).sha256"
          Get-Item dist/release/* | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-linked-navigation-windows-x64-installer
          path: |
            dist/release/*.msi
            dist/release/*.sha256
          retention-days: 30
