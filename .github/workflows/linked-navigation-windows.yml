# Fork-only test build of Sync View (and the linked reference/drawing navigation under it).
# Windows only: format, clippy and tests of the touched crate, then builds an UNSIGNED portable
# Windows x64 zip the same way packaging/windows/package.ps1 does (static CRT, --features heif,
# portable.txt beside the exe), without the MSI. Nothing is published: the zip is a downloadable
# artifact of the run. The official signed release stays in release.yml.
name: Linked navigation (Windows x64 portable)

on:
  push:
    branches: [linked-navigation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linked-navigation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows only (the artist's platform). Format and clippy first: they fail in minutes.
  checks:
    name: checks (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy photocraft-ui-egui
        run: cargo clippy -p photocraft-ui-egui --all-targets --locked -- -D warnings

      - name: Test photocraft-ui-egui (lib + integration tests)
        run: cargo test -p photocraft-ui-egui --lib --tests --locked

  # Offscreen screenshots of the real UI (the project's snapshot example) to check where the Sync
  # View button sits in the options bar. Runs beside the checks; never blocks the zip.
  toolbar-snapshot:
    name: toolbar snapshot (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: snapshot

      - name: Render the options bar
        shell: pwsh
        run: |
          cargo build --release --locked -p photocraft-ui-egui --example snapshot
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $exe = 'target\release\examples\snapshot.exe'
          New-Item -ItemType Directory -Force shots | Out-Null
          $doc = '["engine.execute", {"command": "file.new", "params": {"width": 1920, "height": 1080, "name": "sync-test"}}]'
          $brush = '["ui.set", {"tool": "brush"}]'
          $sync = '["ui.menu.invoke", {"command": "window.arrange.syncView"}]'
          & $exe --out shots/1-no-document.png --size 1600x900 --scale 1 --script "[$brush]"
          & $exe --out shots/2-sync-off.png --size 1600x900 --scale 1 --script "[$doc, $brush]"
          & $exe --out shots/3-sync-on.png --size 1600x900 --scale 1 --script "[$doc, $brush, $sync]"
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        with:
          name: toolbar-snapshots
          path: shots
          retention-days: 14

  portable:
    name: portable zip (windows x64, unsigned)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-x64

      - name: Build photocraft.exe and photocraft-cli.exe
        shell: pwsh
        env:
          # Static CRT, as package.ps1: no Visual C++ redistributable needed on the artist's PC.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          PHOTOCRAFT_REQUIRE_WINRES: "1"
        run: |
          $env:PHOTOCRAFT_BUILD_SHA = "${{ github.sha }}"
          $env:PHOTOCRAFT_BUILD_DATE = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          cargo build --release --locked -p photocraft -p photocraft-cli --features heif --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'target\x86_64-pc-windows-msvc\release'
          # PE checks, as package.ps1: x64 machine; the app is GUI (2), the CLI console (3).
          function Get-PeHeader([string] $Path) {
            $b = [IO.File]::ReadAllBytes($Path); $pe = [BitConverter]::ToInt32($b, 0x3C)
            @{ Machine = [BitConverter]::ToUInt16($b, $pe + 4); Subsystem = [BitConverter]::ToUInt16($b, $pe + 0x5C) }
          }
          foreach ($c in @(@('photocraft.exe', 2), @('photocraft-cli.exe', 3))) {
            $h = Get-PeHeader (Join-Path $bin $c[0])
            if ($h.Machine -ne 0x8664 -or $h.Subsystem -ne $c[1]) { throw "$($c[0]): machine $($h.Machine) subsystem $($h.Subsystem)" }
          }
          & (Join-Path $bin 'photocraft-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "photocraft-cli --version failed" }
          $name = "photocraft-linked-navigation-windows-x64-portable"
          $dir = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item (Join-Path $bin 'photocraft.exe'), (Join-Path $bin 'photocraft-cli.exe') $dir
          foreach ($f in 'README.md', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md') { if (Test-Path $f) { Copy-Item $f $dir } }
          # Portable mode: settings and presets go to PhotoCraftData\ next to the exe.
          Copy-Item 'packaging\windows\portable.txt' $dir
          @"
          PhotoCraft - Sync View test build (UNSIGNED)
          Built from ${{ github.repository }} @ ${{ github.sha }}

          This build is not code-signed. Windows SmartScreen or your antivirus may warn before
          it runs; that is expected for a custom build. Do not turn your antivirus off.

          Try it: open an image, then click the Sync View button at the right end of the tool
          options bar (two frames around circling arrows). A second window opens on the same
          image; zoom, pan and rotation follow in both. Click it again to close that window.
          "@ | Set-Content -Encoding utf8 (Join-Path $dir 'READ-ME-FIRST.txt')
          Get-FileHash (Join-Path $dir '*.exe') -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii (Join-Path $dir 'SHA256SUMS.txt')
          Get-Content (Join-Path $dir 'SHA256SUMS.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-linked-navigation-windows-x64-portable
          path: dist/photocraft-linked-navigation-windows-x64-portable
          retention-days: 30
